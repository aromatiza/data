<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriX Data — À valider</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <div id="app" class="layout" hidden>
    <div id="side"></div>
    <main>
      <h1>File d'audit</h1>
      <p class="lead">Ouvre un élément, contrôle les points signalés, coche la checklist, décide. Le bouton « Suivant » t'emmène directement à l'élément d'après.
        Les éléments <span class="st st-ver">Vérifié (audit IA)</span> sont en tête : l'IA n'y a trouvé aucun problème bloquant, mais seule ta décision les valide.</p>

      <div class="qtabs" role="tablist">
        <button type="button" data-tab="dish" class="on">Plats <span id="n-dish">…</span></button>
        <button type="button" data-tab="product">Produits <span id="n-product">…</span></button>
      </div>

      <div class="actions" style="margin-bottom:10px">
        <button type="button" class="primary" id="start">Commencer l'audit</button>
        <label class="muted"><input type="checkbox" id="only-clean"> Seulement sans alerte</label>
      </div>
      <div id="cats" class="catbar"></div>
      <div id="list">Chargement…</div>
    </main>
  </div>

  <script type="module">
    import { sb, esc, requireTeamMember, nav, wireLogout, loadCategories, categoryName, renderCategoryBar, matchCategory,
      statusBadge, levelBadge, nutriBadge, novaBadge, ratingBadge } from "./app.js";
    import { productChecks } from "./audit.js";

    let tab = "dish";
    let cats = { dish: [], product: [] };
    const data = { dish: [], product: [] };
    const state = { dish: { cat: "" }, product: { cat: "" } };
    const groups = {};

    const num = (x) => (x === null || x === undefined || x === "" || isNaN(Number(x))) ? null : Number(x);
    const img = (url, alt) => /^https:\/\//.test(url || "") ? `<img src="${esc(url)}" alt="${esc(alt)}" loading="lazy">` : `<span class="noimg" title="pas d'image"></span>`;

    // Alertes visibles d'un coup d'œil (aide à l'audit, pas une décision)
    function dishFlags(d) {
      const f = [];
      const rec = (d.recipes || []).slice().sort((a, b) => b.version - a.version)[0];
      const nSrc = (rec?.sources || []).filter((s) => /^https?:\/\//.test(s.url || "")).length;
      if (nSrc < 3) f.push(nSrc ? `${nSrc} source(s) sur 3 min.` : "Aucune source");
      if (num(d.atwater_gap_pct) > 10) f.push(`Écart Atwater ${num(d.atwater_gap_pct).toFixed(1)} %`);
      if (num(d.tmca_gap_pct) > 15) f.push(`Écart TMCA ${num(d.tmca_gap_pct).toFixed(1)} %`);
      if (num(d.n_unlinked) > 0) f.push(`${d.n_unlinked} ingrédient(s) non relié(s)`);
      if (num(d.n_method_missing) > 0) f.push(`${d.n_method_missing} cuisson(s) non précisée(s)`);
      if (d.weight_basis === "non_mesure") f.push("Poids cuit non sourcé");
      if (num(d.worst_source_level) >= 4) f.push("Source faible (S4–S5)");
      if (!d.portion_g) f.push("Portion manquante");
      if (!/^https:\/\//.test(d.image_url || "")) f.push("Pas d'image");
      return f;
    }
    function productFlags(p) {
      const f = productChecks(p).filter(([ok]) => !ok).map(([, t]) => t);
      if (p.values_source === "photo_etiquette_ia") f.push("Valeurs lues par l'IA");
      if (p.nova_source === "estimation_ia") f.push("NOVA estimé par l'IA");
      if (p.scores_source === "calcul") f.push("Nutri-Score calculé");
      return f;
    }

    async function loadDishes() {
      const { data: rows, error } = await sb.from("dish_nutrition").select("*").in("status", ["a_valider", "verifie"]);
      if (error) throw error;
      const ids = rows.map((d) => d.dish_id);
      const { data: extra, error: e2 } = ids.length ? await sb.from("dishes")
        .select("id, name_ar, name_darija, category, region, confidence, image_url, group_id, variant_label, audit_score, portion_g, recipes(sources, version)")
        .in("id", ids) : { data: [] };
      if (e2) throw e2;
      const byId = Object.fromEntries((extra || []).map((x) => [x.id, x]));
      data.dish = rows.map((d) => ({ ...byId[d.dish_id], ...d, portion_g: d.portion_g ?? byId[d.dish_id]?.portion_g }));
      const gids = [...new Set(data.dish.map((d) => d.group_id).filter(Boolean))];
      if (gids.length) {
        const { data: g } = await sb.from("dish_groups").select("id, name_fr").in("id", gids);
        (g || []).forEach((x) => { groups[x.id] = x.name_fr; });
      }
      data.dish.forEach((d) => { d._id = d.dish_id; d._flags = dishFlags(d); });
    }

    async function loadProducts() {
      const { data: rows, error } = await sb.from("products")
        .select("id, name, brand, barcode, category, status, source_level, image_url, energy_kcal, fat_g, sat_fat_g, carbs_g, sugars_g, fiber_g, protein_g, salt_g, nutriscore_grade, nutriscore_score, nova_group, scores_source, nova_source, values_source, rating, audit_score")
        .in("status", ["a_valider", "verifie"]);
      if (error) throw error;
      data.product = rows.map((p) => ({ ...p, _id: p.id, _flags: productFlags(p) }));
    }

    // Tri : vérifié par l'IA d'abord, puis le moins d'alertes, puis par nom
    const sorted = (list, name) => list.slice().sort((a, b) =>
      (b.status === "verifie") - (a.status === "verifie") || a._flags.length - b._flags.length || String(name(a)).localeCompare(String(name(b)), "fr"));

    function visible() {
      const only = document.getElementById("only-clean").checked;
      const name = tab === "dish" ? (d) => d.name_fr : (p) => p.name;
      return sorted(data[tab].filter((x) => matchCategory(state[tab], x.category) && (!only || !x._flags.length)), name);
    }

    function render() {
      document.getElementById("n-dish").textContent = data.dish.length;
      document.getElementById("n-product").textContent = data.product.length;
      document.querySelectorAll(".qtabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
      renderCategoryBar(document.getElementById("cats"), cats[tab], data[tab], (x) => x.category, state[tab], render);
      const list = visible();
      const box = document.getElementById("list");
      document.getElementById("start").disabled = !list.length;
      if (!list.length) { box.innerHTML = `<p class="muted">Rien à auditer ici. Bravo.</p>`; return; }
      box.innerHTML = list.map(tab === "dish" ? dishItem : productItem).join("");
    }

    function chips(flags) {
      return flags.length
        ? flags.slice(0, 4).map((t) => `<span class="tag warn">${esc(t)}</span>`).join("") + (flags.length > 4 ? `<span class="tag warn">+${flags.length - 4}</span>` : "")
        : `<span class="tag ok">Aucune alerte</span>`;
    }

    function dishItem(d) {
      const sub = [groups[d.group_id] && d.variant_label ? `${groups[d.group_id]} · ${d.variant_label}` : "", d.name_darija, categoryName(cats.dish, d.category), d.region].filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i).map(esc).join(" · ");
      return `<div class="qitem ${d.status === "verifie" ? "is-ver" : d._flags.length ? "is-warn" : "is-clean"}">
        ${img(d.image_url, d.name_fr)}
        <div>
          <div class="t">${esc(d.name_fr)} ${statusBadge(d.status, d.worst_source_level)}</div>
          <div class="sub">${sub}</div>
          <div class="chips">${chips(d._flags)}</div>
          <details><summary>Valeurs et scores</summary>
            <div class="sub">${d.energy_kcal_100g ?? "–"} kcal · P ${d.protein_g_100g ?? "–"} · G ${d.carbs_g_100g ?? "–"} · L ${d.fat_g_100g ?? "–"} g / 100 g · ${d.n_ingredients ?? "?"} ingrédients</div>
            <div class="scores">${levelBadge(d.worst_source_level)} ${ratingBadge(d.rating)} ${nutriBadge(d.nutriscore_grade, d.nutriscore_score ?? "")} ${novaBadge(d.nova_group)}${d.audit_score != null ? ` <span class="audit">Audit IA ${d.audit_score}<small>/100</small></span>` : ""}</div>
          </details>
        </div>
        <div class="actions">
          <a href="modifier.html?plat=${d.dish_id}"><button type="button">Modifier</button></a>
          <button type="button" class="primary" data-open="${d.dish_id}">Auditer</button>
        </div></div>`;
    }

    function productItem(p) {
      return `<div class="qitem ${p.status === "verifie" ? "is-ver" : p._flags.length ? "is-warn" : "is-clean"}">
        ${img(p.image_url, p.name)}
        <div>
          <div class="t">${esc(p.name)} ${statusBadge(p.status, p.source_level)}</div>
          <div class="sub">${[p.brand, p.barcode, categoryName(cats.product, p.category)].filter(Boolean).map(esc).join(" · ")}</div>
          <div class="chips">${chips(p._flags)}</div>
          <details><summary>Valeurs et scores</summary>
            <div class="sub">${p.energy_kcal ?? "–"} kcal · sucres ${p.sugars_g ?? "–"} g · sel ${p.salt_g ?? "–"} g / 100 g</div>
            <div class="scores">${levelBadge(p.source_level)} ${ratingBadge(p.rating)} ${nutriBadge(p.nutriscore_grade, p.nutriscore_score ?? "")} ${novaBadge(p.nova_group)}${p.audit_score != null ? ` <span class="audit">Audit IA ${p.audit_score}<small>/100</small></span>` : ""}</div>
          </details>
        </div>
        <div class="actions">
          <a href="modifier.html?produit=${p.id}"><button type="button">Modifier</button></a>
          <button type="button" class="primary" data-open="${p.id}">Auditer</button>
        </div></div>`;
    }

    // La file (ordre affiché) est gardée pour le bouton « Suivant » de la fiche
    function openItem(id) {
      const queue = visible().map((x) => x._id);
      sessionStorage.setItem("nxQueue", JSON.stringify({ kind: tab, ids: queue }));
      location.href = `fiche.html?${tab === "dish" ? "plat" : "produit"}=${id}#audit`;
    }

    document.querySelector("main").addEventListener("click", (e) => {
      const t = e.target.closest("button[data-tab]");
      if (t) { tab = t.dataset.tab; render(); return; }
      const o = e.target.closest("button[data-open]");
      if (o) openItem(Number(o.dataset.open));
    });
    document.getElementById("start").onclick = () => { const first = visible()[0]; if (first) openItem(first._id); };
    document.getElementById("only-clean").onchange = render;

    (async () => {
      const member = await requireTeamMember();
      if (!member) return;
      if (member.role === "agent") { document.body.innerHTML = "<p class='notice'>Le compte agent ne valide pas les données.</p>"; return; }
      document.getElementById("side").outerHTML = nav("a-valider.html");
      wireLogout();
      document.getElementById("app").hidden = false;
      if (new URLSearchParams(location.search).get("tab") === "product") tab = "product";
      try {
        const [dc, pc] = await Promise.all([loadCategories("dish"), loadCategories("product"), loadDishes(), loadProducts()]);
        cats = { dish: dc, product: pc };
        render();
      } catch (err) {
        document.getElementById("list").innerHTML = `<p class="notice">Erreur : ${esc(err.message || err)}</p>`;
      }
    })();
  </script>
</body>
</html>
